name: Deploy JK Marmores

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # historico completo para compilar as versoes antigas de /1/ e /2/
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build estatico
        run: npm run build
        env:
          # homolog: noindex + robots Disallow. Trocar a variavel do repositorio
          # para "producao" so no lancamento (o build falha se houver pendencia).
          SITE_MODE: ${{ vars.SITE_MODE || 'homolog' }}

      - name: Versoes para comparacao (/1/, /2/, /3/)
        run: bash scripts/versoes/build.sh
        env:
          SITE_MODE: ${{ vars.SITE_MODE || 'homolog' }}

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -rlptzv --delete --exclude '.well-known/' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            out/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Limpar chave
        if: always()
        run: rm -f ~/.ssh/deploy_key
